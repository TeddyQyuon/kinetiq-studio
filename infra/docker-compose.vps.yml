# Phase 1 VPS Production Override
# Usage: docker compose -f docker-compose.yml -f infra/docker-compose.vps.yml up -d --build

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      APP_ENV: phase1_vps
      RUN_EMBEDDED_ORCHESTRATOR: "false"
      OWNER_GOOGLE_EMAIL: ${OWNER_GOOGLE_EMAIL:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  orchestrator:
    environment:
      APP_ENV: phase1_vps
      OWNER_GOOGLE_EMAIL: ${OWNER_GOOGLE_EMAIL:-}

  web:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      STUDIO_DOMAIN: ${STUDIO_DOMAIN:-studio.example.com}
      API_DOMAIN: ${API_DOMAIN:-api.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
