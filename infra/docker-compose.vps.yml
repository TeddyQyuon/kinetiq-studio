# Phase 1 VPS Production Override
# Usage: docker compose -f docker-compose.yml -f infra/docker-compose.vps.yml up -d --build

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      APP_ENV: phase1_vps
      RUN_EMBEDDED_ORCHESTRATOR: "false"
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      OWNER_GOOGLE_EMAIL: ${OWNER_GOOGLE_EMAIL:-}

  media-worker:
    build:
      args:
        INSTALL_MODELS: "true"
    environment:
      MEDIA_MOCK_MODE: "false"

  orchestrator:
    environment:
      APP_ENV: phase1_vps
      OWNER_GOOGLE_EMAIL: ${OWNER_GOOGLE_EMAIL:-}

  web:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      STUDIO_DOMAIN: ${STUDIO_DOMAIN:-studio.example.com}
      API_DOMAIN: ${API_DOMAIN:-api.example.com}
    volumes:
      - ./infra/${VPS_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./infra/Caddyfile.api:/etc/caddy/Caddyfile.api:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
