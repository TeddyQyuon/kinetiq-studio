name: Kinetiq Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm ci

      - name: Validate JSON and Jupyter notebook files
        run: |
          node -e "
          const fs = require('fs'), path = require('path');
          let count = 0;
          function walk(d) {
            for (const e of fs.readdirSync(d, { withFileTypes: true })) {
              if (['node_modules', '.next', '.git'].includes(e.name)) continue;
              const f = path.join(d, e.name);
              if (e.isDirectory()) walk(f);
              else if (e.name.endsWith('.json') || e.name.endsWith('.ipynb')) {
                JSON.parse(fs.readFileSync(f, 'utf8'));
                count++;
              }
            }
          }
          walk('.');
          console.log('Validated JSON/ipynb files:', count);
          "

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: Next.js production build
        run: npm run build

      - name: Validate VPS preflight and deploy scripts
        run: |
          node --check scripts/check-env.mjs
          bash -n scripts/deploy-vps.sh
          if node scripts/check-env.mjs --file .env.example; then
            echo "Expected .env.example to fail production preflight"
            exit 1
          fi

  api-and-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -e workers/agent-core
          pip install pytest ruff

      - name: Lint Python with Ruff
        run: ruff check apps/api workers

      - name: Run FastAPI core pipeline tests
        working-directory: apps/api
        env:
          STORAGE_PROVIDER: local
          RUN_EMBEDDED_ORCHESTRATOR: "false"
        run: pytest -v
