[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetiq-agent-core"
version = "0.1.0"
description = "Shared worker client and 8 MiB Google Drive resumable uploader for Kinetiq Studio"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kinetiq_agent_core*"]
